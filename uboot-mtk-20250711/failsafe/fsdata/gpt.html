<!DOCTYPE HTML>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GPT更新</title>
	<link rel="stylesheet" href="style.css">
	<script src="main.js"></script>
</head>
<body onload="appInit('gpt')" data-page="gpt">
	<div class="app">
		<aside class="sidebar">
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item"><a href="/"><span class="ico">🧰</span>固件更新</a></li>
				<li class="sidebar-nav-item"><a href="bl2.html"><span class="ico">📦</span>BL2更新</a></li>
				<li class="sidebar-nav-item"><a href="uboot.html"><span class="ico">🔑</span>U-Boot更新</a></li>
				<li class="sidebar-nav-item active"><a href="gpt.html"><span class="ico">💾</span>GPT更新</a></li>
				<li class="sidebar-nav-item"><a href="factory.html"><span class="ico">🏭</span>Factory更新</a></li>
				<li class="sidebar-nav-item"><a href="initramfs.html"><span class="ico">⚡</span>启动内存固件</a></li>
				<li class="sidebar-nav-item"><a href="env.html"><span class="ico">⚙️</span>环境变量</a></li>
				<li class="sidebar-nav-item"><a href="console.html"><span class="ico">💻</span>命令行</a></li>
				<li class="sidebar-nav-item"><a href="backup.html"><span class="ico">💾</span>备份</a></li>
				<li class="sidebar-nav-item"><a href="reboot.html"><span class="ico">🔄</span>重启</a></li>
			</ul>
		</aside>
		<div class="main">
			<div id="m">
				<div class="card-head">
					<h1>💾 GPT 分区表更新</h1>
					<p id="hint">您将要更新设备上的 <strong>GPT（分区表）</strong>。<br>请从本地硬盘中选择文件，然后点击 <strong>上传</strong> 按钮。</p>
				</div>
				<div class="card-main">
					<form id="form">
						<input id="file" type="file" name="gpt">
						<input type="button" value="📤 上传" onclick="upload('gpt')">
					</form>
					<div class="bar" id="bar" style="display:none; --percent:0;"></div>
					<div id="size" style="display: none;">Size: xxxx</div>
					<div id="md5" style="display: none;">MD5: xxxx</div>
					<div id="upgrade" style="display:none;">
						<p>✅ 如果以上信息确认无误，请点击"更新"。</p>
						<button class="button" onclick="location='flashing.html'">🔄 更新</button>
					</div>
				</div>
				<div class="card-foot">
					<div class="i w">
						<strong>⚠️ 注意事项：</strong>
						<ul>
							<li>更新期间不要关闭设备电源</li>
							<li>如果一切顺利，设备将重新启动</li>
							<li>请确保上传正确的 GPT 文件，否则可能导致设备损坏！</li>
						</ul>
					</div>
				</div>
			</div>
			<div id="version"></div>
		</div>
	</div>
</body>
</html>
