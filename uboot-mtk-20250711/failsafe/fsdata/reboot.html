<!DOCTYPE HTML>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rebooting device</title>
	<link rel="stylesheet" href="style.css">
	<script src="i18n.js"></script>
	<script src="main.js"></script>
	<script>
		function init() {
			appInit('reboot');
		}

		function requestReboot(mode) {
			var status = document.getElementById('reboot_status');
			var btnNormal = document.getElementById('btn_reboot');
			var btnFailsafe = document.getElementById('btn_reboot_failsafe');
			var spinner = document.getElementById('l');
			var pollTimer = null;
			var pollStart = Date.now();
			var confirmKey = mode === 'failsafe' ? 'reboot.confirm_failsafe' : 'reboot.confirm';
			var statusKey = mode === 'failsafe' ? 'reboot.status.failsafe' : 'reboot.status.normal';
			var url = mode === 'failsafe' ? '/reboot-failsafe' : '/reboot';

			if (!confirm(t(confirmKey)))
				return;

			if (btnNormal) btnNormal.disabled = true;
			if (btnFailsafe) btnFailsafe.disabled = true;
			if (spinner) spinner.style.display = 'block';

			if (status) {
				status.setAttribute('data-i18n', statusKey);
				status.textContent = t(statusKey);
			}

			ajax({
				url: url,
				done: function () {
					/* server may already be rebooting; keep the page as-is */
				},
				timeout: 30000
			});

			if (mode === 'failsafe') {
				var pollOnce = async function () {
					try {
						var r = await fetch('/version', { method: 'GET', cache: 'no-store' });
						if (r && r.ok) {
							location.href = '/';
							return;
						}
					} catch (e) {
						/* ignore until device is back */
					}
					if (Date.now() - pollStart > 120000) {
						if (pollTimer) {
							clearTimeout(pollTimer);
							pollTimer = null;
						}
						return;
					}
					pollTimer = setTimeout(pollOnce, 1500);
				};
				pollTimer = setTimeout(pollOnce, 1500);
			}
		}
	</script>
</head>
<body onload="init()" data-page="reboot">
	<div class="app">
		<aside class="sidebar">
			<div class="sidebar-brand">
			</div>
			<div class="sidebar-controls">
				<div class="control-row">
					<div>🌐 <span data-i18n="nav.language">语言</span></div>
					<select id="lang_select" onchange="setLang(this.value)">
						<option value="zh-cn">简体中文</option>
						<option value="en">English</option>
					</select>
				</div>
			</div>
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item" id="nav-firmware">
					<a href="/"><span class="ico">🧰</span><span data-i18n="nav.firmware">固件更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-bl2">
					<a href="bl2.html"><span class="ico">📦</span><span data-i18n="nav.bl2">BL2更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-uboot">
					<a href="uboot.html"><span class="ico">🔑</span><span data-i18n="nav.uboot">U-Boot更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-gpt">
					<a href="gpt.html"><span class="ico">💾</span><span data-i18n="nav.gpt">GPT更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-factory">
					<a href="factory.html"><span class="ico">🏭</span><span data-i18n="nav.factory">Factory更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-initramfs">
					<a href="initramfs.html"><span class="ico">⚡</span><span data-i18n="nav.initramfs">启动内存固件</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-env">
					<a href="env.html"><span class="ico">⚙️</span><span data-i18n="nav.env">环境变量</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-console">
					<a href="console.html"><span class="ico">💻</span><span data-i18n="nav.console">命令行</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-flash">
					<a href="flash.html"><span class="ico">🔥</span><span data-i18n="nav.flash">闪存编辑</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-simg">
					<a href="simg.html"><span class="ico">📀</span><span data-i18n="nav.simg">SIMG更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-backup">
					<a href="backup.html"><span class="ico">💾</span><span data-i18n="nav.backup">备份</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-reboot">
					<a><span class="ico">🔄</span><span data-i18n="nav.reboot">重启</span></a>
				</li>
			</ul>
		</aside>
		<main class="main">
			<div id="m">
				<!-- 标题区域移至 card-head，实现自动居中 -->
				<div class="card-head">
					<h1 id="title" data-i18n="reboot.title">REBOOT DEVICE</h1>
					<p id="info" data-i18n-html="reboot.info">
						Choose how you want to reboot. Failsafe reboot only takes effect once.
					</p>
				</div>
				
				<!-- 按钮区域居中显示 -->
				<div class="card-main" style="justify-content: center; align-items: center;">
					<div class="form-actions">
						<button id="btn_reboot" class="button" onclick="requestReboot('normal')" data-i18n="reboot.action.normal">Reboot normally</button>
						<button id="btn_reboot_failsafe" class="button button-warn" onclick="requestReboot('failsafe')" data-i18n="reboot.action.failsafe">Reboot into failsafe</button>
					</div>
					<p id="reboot_status" class="console-status" style="text-align: center; margin-top: 16px;"></p>
					<div id="l" style="display:none; margin: 24px auto;"></div>
				</div>
			</div>
			<div id="version"></div>
		</main>
	</div>
</body>
</html>
