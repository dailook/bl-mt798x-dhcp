<!DOCTYPE HTML>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>环境变量</title>
	<link rel="stylesheet" href="style.css">
	<script src="main.js"></script>
</head>
<body onload="appInit('env')" data-page="env">
	<div class="app">
		<aside class="sidebar">
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item"><a href="/"><span class="ico">🧰</span>固件更新</a></li>
				<li class="sidebar-nav-item"><a href="bl2.html"><span class="ico">📦</span>BL2更新</a></li>
				<li class="sidebar-nav-item"><a href="uboot.html"><span class="ico">🔑</span>U-Boot更新</a></li>
				<li class="sidebar-nav-item"><a href="gpt.html"><span class="ico">💾</span>GPT更新</a></li>
				<li class="sidebar-nav-item"><a href="factory.html"><span class="ico">🏭</span>Factory更新</a></li>
				<li class="sidebar-nav-item"><a href="initramfs.html"><span class="ico">⚡</span>启动内存固件</a></li>
				<li class="sidebar-nav-item active"><a href="env.html"><span class="ico">⚙️</span>环境变量</a></li>
				<li class="sidebar-nav-item"><a href="console.html"><span class="ico">💻</span>命令行</a></li>
				<li class="sidebar-nav-item"><a href="backup.html"><span class="ico">💾</span>备份</a></li>
				<li class="sidebar-nav-item"><a href="reboot.html"><span class="ico">🔄</span>重启</a></li>
			</ul>
		</aside>
		<div class="main">
			<div id="m">
				<div class="card-head">
					<h1>⚙️ U-Boot 环境变量</h1>
					<p id="hint">管理 <strong>U-Boot 环境变量</strong>，修改将保存到存储设备。</p>
				</div>
				<div class="card-main">
					<div class="console-card env-card">
						<div class="env-toolbar">
							<a id="env_count" class="env-count"></a><a> | </a><a id="env_status" class="console-status"></a>
						</div>
						<div id="env_list" class="console-output env-output"></div>
						<div class="form-row form-row-2">
							<div class="field">
								<label for="env_name">名称：</label>
								<input id="env_name" class="field-control" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
							</div>
							<div class="field">
								<label for="env_value">值：</label>
								<input id="env_value" class="field-control" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
							</div>
						</div>
						<div class="form-actions">
							<button type="button" class="button" onclick="envSet()">添加/更新</button>
							<button type="button" class="button" onclick="envUnset()">删除</button>
							<button type="button" class="button" onclick="envRefresh()">刷新</button>
						</div>
						<div class="form-row">
							<div class="field">
								<label for="env_file">环境文件：</label>
								<input id="env_file" class="field-control" type="file" />
							</div>
						</div>
						<div class="form-actions">
							<button type="button" class="button" onclick="envReset()">重置为默认</button>
							<button type="button" class="button" onclick="envRestore()">恢复</button>
						</div>
						<div class="env-restore-hint">恢复需要二进制格式的 U-Boot 环境镜像（含 CRC）。</div>
					</div>
				</div>
				<div class="card-foot">
					<div class="i w">
						<strong>⚠️ 注意事项：</strong>
						<ul>
							<li>修改环境变量可能影响启动行为</li>
							<li>保存或恢复过程中请勿断电</li>
						</ul>
					</div>
				</div>
			</div>
			<div id="version"></div>
		</div>
	</div>
</body>
</html>
