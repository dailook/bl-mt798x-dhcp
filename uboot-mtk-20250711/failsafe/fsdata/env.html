<!DOCTYPE HTML>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>环境变量</title>
	<link rel="stylesheet" href="style.css">
	<script src="i18n.js"></script>
	<script src="main.js"></script>
</head>
<body onload="appInit('env')" data-page="env">
	<div class="app">
		<aside class="sidebar">
			<div class="sidebar-brand">
			</div>
			<div class="sidebar-controls">
				<div class="control-row">
					<div>🌐 <span data-i18n="nav.language">语言</span></div>
					<select id="lang_select" onchange="setLang(this.value)">
						<option value="zh-cn" selected>简体中文</option>
						<option value="en">English</option>
					</select>
				</div>
			</div>
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item" id="nav-firmware">
					<a href="/"><span class="ico">🧰</span><span data-i18n="nav.firmware">固件更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-bl2">
					<a href="bl2.html"><span class="ico">📦</span><span data-i18n="nav.bl2">BL2更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-uboot">
					<a href="uboot.html"><span class="ico">🔑</span><span data-i18n="nav.uboot">U-Boot更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-gpt">
					<a href="gpt.html"><span class="ico">💾</span><span data-i18n="nav.gpt">GPT更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-factory">
					<a href="factory.html"><span class="ico">🏭</span><span data-i18n="nav.factory">Factory更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-initramfs">
					<a href="initramfs.html"><span class="ico">⚡</span><span data-i18n="nav.initramfs">启动内存固件</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-env">
					<a><span class="ico">⚙️</span><span data-i18n="nav.env">环境变量</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-console">
					<a href="console.html"><span class="ico">💻</span><span data-i18n="nav.console">命令行</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-flash">
					<a href="flash.html"><span class="ico">🔥</span><span data-i18n="nav.flash">闪存编辑</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-simg">
					<a href="simg.html"><span class="ico">📀</span><span data-i18n="nav.simg">SIMG更新</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-backup">
					<a href="backup.html"><span class="ico">💾</span><span data-i18n="nav.backup">备份</span></a>
				</li>
				<li class="sidebar-nav-item" id="nav-reboot">
					<a href="reboot.html"><span class="ico">🔄</span><span data-i18n="nav.reboot">重启</span></a>
				</li>
			</ul>
		</aside>
		<main class="main">
			<div id="m">
				<div class="card-head">
					<h1 data-i18n="env.title">⚙️ U-Boot 环境变量</h1>
					<p id="hint" data-i18n-html="env.hint">
						管理 <strong>U-Boot 环境变量</strong>。更改将保存到存储中。
					</p>
				</div>
				<div class="card-main">
					<div class="console-card env-card">
						<div class="env-toolbar">
                            <a id="env_count" class="env-count"></a>
							<a> | </a>
							<a id="env_status" class="console-status"></a>
						</div>

						<div id="env_list" class="console-output env-output" aria-label="env list"></div>

						<div class="form-row form-row-2">
							<div class="field">
								<label for="env_name" data-i18n="env.label.name">名称：</label>
								<input id="env_name" class="field-control" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
							</div>
							<div class="field">
								<label for="env_value" data-i18n="env.label.value">值：</label>
								<input id="env_value" class="field-control" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
							</div>
						</div>

						<div class="form-actions">
							<button type="button" class="button" onclick="envSet()" data-i18n="env.action.set">添加/更新</button>
							<button type="button" class="button" onclick="envUnset()" data-i18n="env.action.unset">删除</button>
                            <button type="button" class="button" onclick="envRefresh()" data-i18n="env.action.refresh">刷新</button>
						</div>

						<div class="form-row">
							<div class="field">
								<label for="env_file" data-i18n="env.label.file">环境文件：</label>
								<input id="env_file" class="field-control" type="file" />
							</div>
						</div>
						<div class="form-actions">
                            <button type="button" class="button" onclick="envReset()" data-i18n="env.action.reset">重置为默认值</button>
							<button type="button" class="button" onclick="envRestore()" data-i18n="env.action.restore">恢复</button>
						</div>
						<div class="env-restore-hint" data-i18n="env.restore.hint"></div>
					</div>
				</div>
				<div class="card-foot">
					<div class="i w">
						<strong data-i18n="common.warnings">⚠️ 注意事项：</strong>
						<ul>
							<li data-i18n="env.warn.1">修改环境变量可能会影响启动行为。</li>
							<li data-i18n="env.warn.2">保存或恢复期间请勿关闭电源。</li>
						</ul>
					</div>
				</div>
			</div>
			<div id="version"></div>
		</main>
	</div>
</body>
</html>
