<!DOCTYPE HTML>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>备份</title>
	<link rel="stylesheet" href="style.css">
	<script src="main.js"></script>
</head>
<body onload="appInit('backup')" data-page="backup">
	<div class="app">
		<aside class="sidebar">
			<ul class="sidebar-nav">
				<li class="sidebar-nav-item"><a href="/"><span class="ico">🧰</span>固件更新</a></li>
				<li class="sidebar-nav-item"><a href="bl2.html"><span class="ico">📦</span>BL2更新</a></li>
				<li class="sidebar-nav-item"><a href="uboot.html"><span class="ico">🔑</span>U-Boot更新</a></li>
				<li class="sidebar-nav-item"><a href="gpt.html"><span class="ico">💾</span>GPT更新</a></li>
				<li class="sidebar-nav-item"><a href="factory.html"><span class="ico">🏭</span>Factory更新</a></li>
				<li class="sidebar-nav-item"><a href="initramfs.html"><span class="ico">⚡</span>启动内存固件</a></li>
				<li class="sidebar-nav-item"><a href="env.html"><span class="ico">⚙️</span>环境变量</a></li>
				<li class="sidebar-nav-item"><a href="console.html"><span class="ico">💻</span>命令行</a></li>
				<li class="sidebar-nav-item active"><a href="backup.html"><span class="ico">💾</span>备份</a></li>
				<li class="sidebar-nav-item"><a href="reboot.html"><span class="ico">🔄</span>重启</a></li>
			</ul>
		</aside>
		<div class="main">
			<div id="m">
				<div class="card-head">
					<h1>💾 备份</h1>
					<p id="hint">从设备存储中下载备份为 <strong>二进制文件</strong>。<br>备份数据将流式传输到浏览器并保存在您的计算机上。</p>
				</div>
				<div class="card-main">
					<div id="backup_info" class="backup-info"></div>
					<div class="backup-form">
						<div class="form-row form-row-2" id="backup_mode_target_row">
							<div class="field">
								<label for="backup_mode">模式：</label>
								<select id="backup_mode" class="field-control">
									<option value="part">分区备份</option>
									<option value="range">自定义范围</option>
								</select>
							</div>
							<div class="field" id="backup_target_field">
								<label for="backup_target">目标：</label>
								<select id="backup_target" class="field-control"></select>
							</div>
						</div>
						<div id="backup_range" class="backup-range" style="display:none;">
							<div class="form-row form-row-2">
								<div class="field">
									<label for="backup_start">起始：</label>
									<input id="backup_start" class="field-control" type="text" placeholder="0x0 / 64KiB">
								</div>
								<div class="field">
									<label for="backup_end">结束（不包含）：</label>
									<input id="backup_end" class="field-control" type="text" placeholder="0x1000 / 128KiB">
								</div>
							</div>
							<div id="backup_range_hint" class="backup-range-hint"></div>
						</div>
						<div class="form-actions">
							<button type="button" class="button" onclick="startBackup()">📥 下载</button>
						</div>
					</div>
					<div class="bar" id="bar" style="display:none; --percent:0;"></div>
					<div id="backup_status" style="display:none;"></div>
				</div>
				<div class="card-foot">
					<div class="i w">
						<strong>⚠️ 注意事项：</strong>
						<ul>
							<li>备份过程中不要关闭设备电源</li>
							<li>自定义范围读取原始字节，请谨慎设置偏移量</li>
							<li>大容量备份可能需要较长时间</li>
						</ul>
					</div>
				</div>
			</div>
			<div id="version"></div>
		</div>
	</div>
</body>
</html>
